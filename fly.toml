# AEGIS — Fly.io deployment config
# app name is patched by scripts/deploy-fly.mjs (or set here before fly deploy)
app = "aegis"
primary_region = "iad"

[env]
  AEGIS_HOST = "0.0.0.0"
  AEGIS_PORT = "8787"
  AEGIS_DATA_DIR = "/data"
  NODE_ENV = "production"

[experimental]
  auto_rollback = true

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 10
    hard_limit = 20

  [http_service.checks]
    [http_service.checks.health]
      interval = "10s"
      timeout = "3s"
      grace_period = "30s"
      method = "GET"
      path = "/api/health"

# Persistent volume: accounts, projects, DuckDB analytics survive restarts
[mounts]
  source = "aegis_data"
  destination = "/data"